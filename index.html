<style>

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans",sans-serif,system-ui;background:var(--bg);color:var(--txt);line-height:1.7;overflow-x:hidden;transition:background .5s,color .5s}

.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;width:640px;height:640px;border-radius:50%;filter:blur(90px);opacity:var(--glow);animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a);top:-200px;right:-150px}
.aurora i:nth-child(2){background:var(--c);bottom:-250px;left:-200px;animation-duration:23s}

#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));z-index:90}
nav{position:fixed;top:0;left:0;right:0;z-index:60;padding:16px 0;transition:.35s}

.ni{display:flex;align-items:center;gap:14px}
.logo{font-weight:800;font-size:18px;letter-spacing:-.02em;background:linear-gradient(120deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-right:auto}
